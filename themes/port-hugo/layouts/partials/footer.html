<div class="footer container text-center" id="contact">
  <ul class="footer-icons list-inline">
    {{ range $.Site.Params.social }}
      <li>
        <a href="{{ .link | safeURL }}" target="_blank" rel="noreferrer"
          ><i class="{{ .icon }} footer-icon fa-3x" aria-label="{{ .alt }}"></i
        ></a>
        
      </li>
    {{ end }}
  </ul>
  <div class="credit">
    {{ $.Site.Params.copyright | markdownify }}
    <span id="current-year"></span>
    <div></div>
    <body>This organization is a registered student organization of Cornell University</body>
    <div style="margin-top: 10px;">
      <a href="https://hr.cornell.edu/about/workplace-rights/equal-education-and-employment" style="color: inherit; text-decoration: none;">Equal Education & Employment</a>
    </div>
  </div>
</div>
